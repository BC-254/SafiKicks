services:
  - type: web
    name: safikicks
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: safikicks-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: PHONE_SESSION_EXPIRES_IN
        value: 10m
      - key: SMS_PROVIDER
        value: africastalking
      - key: SMS_MODE
        value: mock
      - key: SHOP_TIMEZONE
        value: Africa/Nairobi
      - key: CORS_ORIGIN
        value: https://safikicks.onrender.com
      - key: APP_BASE_URL
        value: https://safikicks.onrender.com

databases:
  - name: safikicks-db
    databaseName: safikicks
    user: safikicks
    plan: free
